[package]
name = "peugeot300mille"
version = "0.8.0"
edition = "2021"
description = "Analog video feedback glitch box for Linux: composite NTSC signal, enhancer with feedback, sync mixer, TV and camera loop."
license = "MIT"

[dependencies]
anyhow = "1"
cpal = "0.15"
eframe = "0.31"
rayon = "1"
rustfft = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2
